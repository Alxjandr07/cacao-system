services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: cacao_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cacao_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/cacao_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: root
      APP_BACKUP_DIR: /data/backups
      TZ: America/Guayaquil
    volumes:
      - backups:/data/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  backups:
