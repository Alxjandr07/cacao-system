<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — CacaoGest</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&family=DM+Sans:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/cacaogest.css">
  <style>
    .dashboard-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
    .dash-card { background:#fff; border:0.8px solid var(--border-color); border-radius:10px; padding:18px 20px; }
    .dash-card-title { font-family:'Inter',sans-serif; font-weight:600; font-size:13px; color:var(--text-dark); margin-bottom:14px; display:flex; align-items:center; gap:8px; }
    .dash-card-title .count { margin-left:auto; font-size:11px; color:var(--border-color); font-weight:400; }
    .alerta-item { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:0.8px solid #f0f0f0; font-size:13px; }
    .alerta-item:last-child { border-bottom:none; }
    .alerta-icon { font-size:18px; flex-shrink:0; }
    .alerta-text { flex:1; }
    .alerta-text .producto { font-weight:500; color:var(--text-dark); }
    .alerta-text .detalle { font-size:11px; color:var(--text-main); margin-top:1px; }
    .alerta-stock { font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:700; color:var(--red-text); white-space:nowrap; }
    .dash-row { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:0.8px solid #f0f0f0; font-size:13px; }
    .dash-row:last-child { border-bottom:none; }
    .dash-row .dash-main { flex:1; font-weight:500; color:var(--text-dark); }
    .dash-row .dash-sub { display:block; font-size:11px; color:var(--border-color); font-weight:400; margin-top:1px; }
    .empty-dash { padding:20px; text-align:center; color:var(--border-color); font-size:13px; }
  </style>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">🫘</div>
    <div class="logo-text">
      <div class="brand"><span class="cacao">CACAO</span><span class="gest">GEST</span></div>
      <div class="cycle">Ciclo 2026</div>
    </div>
  </div>
  <div class="nav-body">
    <div class="nav-section-label">PRINCIPAL</div>
    <a class="nav-item active" href="dashboard.html"><span class="nav-icon">⊞</span> Dashboard</a>
    <div class="nav-section-label">GESTIÓN</div>
    <a class="nav-item" href="usuarios.html"><span class="nav-icon">👥</span> Usuarios y Roles</a>
    <a class="nav-item" href="personal.html"><span class="nav-icon">👤</span> Gestión de Personal</a>
    <a class="nav-item" href="clientes.html"><span class="nav-icon">📋</span> Clientes</a>
    <a class="nav-item" href="proveedores.html"><span class="nav-icon">🚚</span> Proveedores</a>
    <div class="nav-section-label">PRODUCCIÓN</div>
    <a class="nav-item" href="inventario.html"><span class="nav-icon">📦</span> Inventario</a>
    <a class="nav-item" href="cultivo.html"><span class="nav-icon">🌱</span> Cultivo y Mant.</a>
    <a class="nav-item" href="cosecha.html"><span class="nav-icon">🫘</span> Cosecha</a>
    <div class="nav-section-label">COMERCIAL</div>
    <a class="nav-item" href="ventas.html"><span class="nav-icon">💰</span> Ventas</a>
    <a class="nav-item" href="facturacion.html"><span class="nav-icon">🧾</span> Facturación y Reportes</a>
    <a class="nav-item" href="trazabilidad.html"><span class="nav-icon">🔍</span> Trazabilidad</a>
  </div>
  <div class="sidebar-user">
    <div class="user-avatar">🌿</div>
    <div class="user-info"><div class="uname" id="dashUser">Administrador</div><div class="urole" id="dashRol">admin123</div></div>
    <span class="user-chevron">▲</span>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <div>
      <div class="page-title">Dashboard</div>
      <div class="page-sub" id="dashSub">Resumen general del sistema</div>
    </div>
    <button class="btn-outline" onclick="cargarDashboard(true)">↻ Actualizar</button>
  </div>
  <div class="content">
    <div class="kpi-grid" id="kpiGrid"></div>
    <div class="dashboard-grid" id="cardsGrid"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
