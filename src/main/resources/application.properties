# Conexión PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/cacao_db
spring.datasource.username=postgres
spring.datasource.password=root

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Zona horaria Ecuador
spring.jackson.time-zone=America/Guayaquil

# Puerto del servidor
server.port=8081

# Respaldos de base de datos (ruta absoluta: el CWD del proceso puede variar)
app.backup.dir=C:/Users/alxja/cacao-system/backups